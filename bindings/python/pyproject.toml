[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vedaksha"
version = "9.1.0"
description = "Clean-room Vedic astronomy & Jyotish engine — the Rust Vedaksha engine hosted from Python via WebAssembly"
readme = "README.md"
requires-python = ">=3.9"
license = "BUSL-1.1"
authors = [{ name = "ArthIQ Labs LLC", email = "info@arthiq.net" }]
keywords = [
    "astronomy", "ephemeris", "vedic", "jyotish", "astrology", "wasm",
    "kundali", "panchang", "panchanga", "nakshatra", "dasha", "horoscope",
    "natal-chart", "muhurta", "sidereal", "ayanamsha", "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: Other/Proprietary License",
]
dependencies = ["wasmtime>=20"]

[project.optional-dependencies]
rest = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vedaksha = "vedaksha.cli:main"

[project.urls]
Homepage = "https://vedaksha.net"
Source = "https://github.com/arthiqlabs/vedaksha/tree/main/bindings/python"
Engine = "https://github.com/arthiqlabs/vedaksha"

# The wasm blob is a build artifact (not committed): run scripts/build-wasm.sh
# to produce src/vedaksha/_wasm/vedaksha.wasm before building the wheel/sdist.
# Both dists carry the blob so end users never need a Rust toolchain.
[tool.hatch.build.targets.wheel]
packages = ["src/vedaksha"]
artifacts = ["src/vedaksha/_wasm/vedaksha.wasm"]

[tool.hatch.build.targets.wheel.force-include]
"src/vedaksha/_wasm/vedaksha.wasm" = "vedaksha/_wasm/vedaksha.wasm"

[tool.hatch.build.targets.sdist]
include = ["src/vedaksha", "engine", "scripts", "tests", "README.md", "ARCHITECTURE.md"]
artifacts = ["src/vedaksha/_wasm/vedaksha.wasm"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "RUF"]
# B008: FastAPI's `= Body(...)` / `= Header(...)` defaults are the framework idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
