name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # A stale version does not make a publish fail — the "already published"
  # branch in publish-crates exists so a re-run of a partially-failed release
  # can continue, and it swallows a version that was never bumped. That is how
  # v3.2.0 shipped with a Cargo.lock still pinning 3.1.0, and how the Python
  # wheel sat at 3.0.1 across two releases before it was removed from this
  # repo. Fail the tag before anything ships instead.
  version-check:
    name: Versions match the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert published versions equal ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            if [ "$2" = "$tag" ]; then
              echo "ok: $1 = $2"
            else
              echo "::error::$1 is '$2', expected '$tag'"
              fail=1
            fi
          }
          check "Cargo.toml [workspace.package] version" \
            "$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          check "Cargo.lock vedaksha entry" \
            "$(sed -n '/^name = "vedaksha"$/{n;s/^version = "\(.*\)"/\1/p;}' Cargo.lock | head -1)"
          # The Python wheel sat at 3.0.1 across two releases before it was
          # removed — assert it too, so a stale binding fails the tag.
          check "bindings/python pyproject version" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' bindings/python/pyproject.toml | head -1)"
          check "bindings/python __version__" \
            "$(sed -n 's/^__version__ = "\(.*\)"/\1/p' bindings/python/src/vedaksha/__init__.py)"
          check "MCP tool snapshot engineVersion" \
            "$(sed -n 's/.*"engineVersion": "\(.*\)".*/\1/p' tools/mcp-tools.json)"
          # server.json is what the official MCP Registry publishes. Asserting it
          # here keeps the committed file truthful, rather than rewriting it at
          # publish time and letting the repo copy drift.
          check "server.json version" "$(jq -r .version server.json)"
          # metrics.json is what vedaksha.net reads to stay current without a
          # deploy. Asserting it here is what stops the site silently
          # advertising the previous release forever.
          check "metrics.json engineVersion" "$(jq -r .engineVersion metrics.json)"
          # Citation metadata. CITATION.cff is what GitHub renders behind the
          # repo's "Cite this repository" button and codemeta.json is what
          # software-metadata harvesters read, so a stale version here is
          # publicly wrong in a way a reader is invited to copy. Both arrived
          # with the preprint branch already reading 7.4.0 while the engine was
          # at 9.1.0 -- caught by hand at merge time, which is exactly the
          # accident this job exists to stop happening twice.
          check "CITATION.cff version" \
            "$(sed -n 's/^version: \(.*\)$/\1/p' CITATION.cff)"
          check "codemeta.json softwareVersion" \
            "$(jq -r .softwareVersion codemeta.json)"
          exit $fail

  # The gate that did not exist until v7.2.0.
  #
  # Every publish job below used to depend on version-check alone, which only
  # compares version strings to the tag. Nothing ran a single test between a
  # tag push and an IRREVERSIBLE crates.io publish — the tag IS the release,
  # and a yank withdraws nothing. The only protection was a human remembering
  # to look at the CI run on that SHA.
  #
  # This was not added earlier because it was not affordable: the suite took
  # 67-95 minutes in a debug profile. It now takes ~3 minutes, because the hot
  # crates compile at opt-level 3 while keeping debug-assertions and
  # overflow-checks. Affordable is why this exists.
  test:
    name: Test the tagged tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Guards
        run: |
          python3 scripts/check_publish_order.py
          python3 scripts/check_license_sync.py
          python3 scripts/check_spdx_headers.py
          python3 scripts/check_mcp_image_label.py
      # Same skip as ci.yml: analytical_oracle_regression walks all 24,350
      # committed oracle rows and belongs to the weekly release-profile tier.
      - name: Test
        run: cargo test --workspace --locked -- --skip analytical_oracle_regression

  build-mcp:
    name: Build MCP binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # x86-64-v3 raises the floor to AVX2 (Intel Haswell 2013+ / AMD
          # Excavator+), which is what makes the SIMD lunar kernel run 4-wide.
          # Hosts without AVX2 will SIGILL — lower to x86-64-v2 (or empty) if
          # broad pre-2013 x86 support is required.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: vedaksha-mcp
            rustflags: "-C target-cpu=x86-64-v3"
          # aarch64 already includes NEON at baseline; no extra flag needed.
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: vedaksha-mcp
            rustflags: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }} -p vedaksha-mcp
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} dist/vedaksha-mcp-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-${{ matrix.target }}
          path: dist/

  wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack
      - name: Build WASM
        # +simd128 makes wide's f64x4 vectorize the lunar kernel in the
        # browser (otherwise it falls back to scalar). Universally supported
        # by current browsers/runtimes; a runtime without simd128 cannot
        # instantiate the module.
        env:
          RUSTFLAGS: "-C target-feature=+simd128"
        run: wasm-pack build --target web crates/vedaksha-wasm/
      - uses: actions/upload-artifact@v4
        with:
          name: vedaksha-wasm
          path: crates/vedaksha-wasm/pkg/

  publish-crates:
    name: Publish to crates.io
    needs: [version-check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eo pipefail
          # ORDER IS DEPENDENCY ORDER, not alphabetical. Every crate must appear
          # after everything it depends on, because cargo resolves each
          # dependency against what is already ON crates.io -- a path dependency
          # is not enough at publish time.
          #
          # v5.0.1 learned this the hard way: vedaksha-graph gained an optional
          # vedaksha-astro dependency (the from-chart feature) while still
          # sitting BEFORE astro in this list, so the publish died on
          # "failed to select a version for the requirement vedaksha-astro
          # = ^5.0.1" after math and ephem-core had already gone out --
          # a partial release, and crates.io publishes cannot be withdrawn.
          #
          # If you add a dependency between two workspace crates, re-check this
          # line. `cargo tree -p <crate>` shows what must precede it.
          #
          # v3.0.0: vedaksha-emit folded into vedaksha-graph[emitters];
          # vedaksha-locale folded into vedaksha[locale]; vedaksha-wasm
          # is published to npm only (publish = false in its Cargo.toml).
          for crate in vedaksha-math vedaksha-ephem-core vedaksha-astro vedaksha-graph vedaksha-vedic vedaksha-mcp vedaksha; do
            echo "::group::Publishing $crate"
            log=$(mktemp)
            if cargo publish -p "$crate" --allow-dirty 2>&1 | tee "$log"; then
              echo "::endgroup::"
              echo "published $crate"
            else
              if grep -qEi 'already.{0,15}(exists|uploaded|published)|crate version.*is already' "$log"; then
                echo "::endgroup::"
                echo "skip $crate (already on crates.io)"
              else
                echo "::endgroup::"
                echo "::error::$crate publish failed — see log above"
                exit 1
              fi
            fi
            sleep 60
          done

  publish-npm:
    name: Publish to npm
    needs: [wasm, version-check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vedaksha-wasm
          path: crates/vedaksha-wasm/pkg/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm
        working-directory: crates/vedaksha-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  publish-pypi:
    name: Publish to PyPI
    needs: [version-check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the wasm blob from engine source
        working-directory: bindings/python
        run: ./scripts/build-wasm.sh
      - name: Build wheel + sdist
        working-directory: bindings/python
        run: |
          pip install build twine
          python -m build
      - name: Publish to PyPI
        working-directory: bindings/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        # --skip-existing is safe here because version-check already guarantees
        # the version was bumped; it only no-ops on a re-run of this same tag.
        run: twine upload --skip-existing dist/*

  docker:
    name: Push Docker image (multi-arch)
    needs: [version-check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # TARGETARCH in the Dockerfile selects codegen per platform, so the
          # AVX2 flag applies only to amd64 and arm64 builds on NEON baseline.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/arthiqlabs/vedaksha-mcp:latest
            ghcr.io/arthiqlabs/vedaksha-mcp:${{ github.ref_name }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    # Depends on `docker` because server.json declares the published image as
    # an installable OCI package from v7.3.0. Publishing the registry entry
    # first would advertise ghcr.io/arthiqlabs/vedaksha-mcp:<tag> to every MCP
    # client while that tag did not yet exist — a pull failure for anyone who
    # resolved it in the window between the two jobs.
    needs: [version-check, test, docker]
    runs-on: ubuntu-latest
    permissions:
      # OIDC is what proves we own the io.github.arthiqlabs namespace. No token
      # to store, rotate, or leak -- unlike the npm secret, which had to be
      # rotated after being pasted into a chat.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish

  github-release:
    name: Create GitHub Release
    needs: [build-mcp, wasm, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: 'mcp-*'
      - uses: actions/download-artifact@v4
        with:
          name: vedaksha-wasm
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mcp-*/**/*
            vedaksha-wasm/**/*
