# Publish a tagged release to Smithery (arthiq-labs/vedaksha) as a stdio MCPB
# bundle.
#
# Smithery was the one registry release.yml did not reach: every release until
# v10.0.0 was pushed to it by hand from a laptop, and the listing drifted
# behind the engine whenever that step was forgotten. release.yml now calls
# this after the GitHub Release exists; workflow_dispatch republishes a tag
# that is already out, for when the Smithery step alone failed.
#
# It publishes Smithery only. The binaries come from the GitHub Release of the
# tag, so nothing is rebuilt, and the tool card comes from that tag's
# tools/mcp-tools.json. The Smithery CLI is not used: its bundle path cannot
# carry inputSchema (see scripts/build_smithery_release.py).
name: Publish to Smithery

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string
    secrets:
      SMITHERY_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (e.g. 10.0.0)
        required: true
        type: string

jobs:
  publish:
    name: Publish stdio bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      SERVER: arthiq-labs%2Fvedaksha
    steps:
      # The scripts come from this workflow's own commit; the tool list and
      # server.json come from the tag, which may predate the scripts.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          path: tag
      - name: Download the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D bin \
            -p vedaksha-mcp-x86_64-unknown-linux-gnu \
            -p vedaksha-mcp-aarch64-apple-darwin
      - name: Lay out the bundle and payload
        run: python3 scripts/build_smithery_release.py "$VERSION" bin out tag
      - name: Smoke-test the Linux binary from the bundle
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | out/bundle/server/vedaksha-mcp-linux-x64 --stdio > tools-list.json
          python3 - <<'EOF'
          import json
          served = {t["name"] for t in json.load(open("tools-list.json"))["result"]["tools"]}
          card = {t["name"] for t in json.load(open("out/payload.json"))["serverCard"]["tools"]}
          assert served == card, f"binary serves {sorted(served ^ card)} differently from the card"
          print(f"{len(served)} tools match")
          EOF
      - name: Pack
        run: npx -y @anthropic-ai/mcpb@2.1.2 pack out/bundle "out/vedaksha-$VERSION.mcpb"
      - name: Upload the release
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          # The key goes through a mode-600 curl config, never argv, so it
          # cannot appear in a process listing.
          if [ -z "$SMITHERY_API_KEY" ]; then
            echo "SMITHERY_API_KEY is empty; set the repository secret" >&2
            exit 1
          fi
          umask 077
          printf 'header = "Authorization: Bearer %s"\n' "$SMITHERY_API_KEY" > "$RUNNER_TEMP/smithery.curl"
          # Smithery's error body says why a release was refused, so print it
          # whether or not the request succeeded.
          code=$(curl -sS -K "$RUNNER_TEMP/smithery.curl" -X PUT \
            "https://api.smithery.ai/servers/$SERVER/releases" \
            -F "payload=<out/payload.json" \
            -F "bundle=@out/vedaksha-$VERSION.mcpb" \
            -o release.json -w '%{http_code}')
          echo "HTTP $code"
          cat release.json
          [ "$code" = 202 ]
      - name: Wait for the release to finish
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          id=$(python3 -c 'import json; print(json.load(open("release.json"))["deploymentId"])')
          for _ in $(seq 1 60); do
            curl -sS --fail-with-body -K "$RUNNER_TEMP/smithery.curl" \
              "https://api.smithery.ai/servers/$SERVER/releases/$id" > status.json
            status=$(python3 -c 'import json; print(json.load(open("status.json"))["status"])')
            echo "release $id: $status"
            case "$status" in
              SUCCESS) exit 0 ;;
              QUEUED|WORKING) sleep 10 ;;
              *) cat status.json; exit 1 ;;
            esac
          done
          echo "release $id still not finished after 10 minutes" >&2
          exit 1
      - name: Remove the curl config
        if: always()
        run: rm -f "$RUNNER_TEMP/smithery.curl"
