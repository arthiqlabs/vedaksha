name: CI

# Routine CI gate: fast feedback on every push and PR. Runs the whole
# workspace test surface in debug — lib, bins, tests/ and doctests.
#
# What is still NOT here, and why, lives in:
#   - .github/workflows/full-validation.yml — manual + weekly. Release-mode
#     build; downloads the 32 MB DE440s kernel so the SpkReader and oracle
#     tests actually execute instead of skipping; sets
#     VEDAKSHA_REQUIRE_FIXTURES=1 so a missing fixture is red, not green;
#     runs the #[ignore]d tiers via --include-ignored (JPL Horizons
#     live-fetch, the legacy lunar oracle, the multi-hour riseset scan
#     sweeps, the MCP 365-day transit search) plus the unskipped
#     analytical_oracle_regression; runs clippy; and re-fetches the IMCCE
#     primary distributions to verify the coefficient blobs have not drifted.
#   - .github/workflows/release.yml         — every tag
# This workflow targets ~3 minutes total.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Unit + integration tests + doctests
        # Debug mode — one build artifact set.
        #
        # This step used to be `--lib` plus one hand-picked integration
        # target. `--lib` compiles neither `tests/` nor the bin targets, so
        # every integration test and every doctest ran ONLY in the weekly
        # Full Validation job. That is the same blind spot that let Full
        # Validation sit red for a fortnight when clippy 1.97 started firing
        # on untouched code: what runs per push was never what runs on the
        # schedule. Concretely it meant `vedaksha-wasm`'s
        # mcp_surface_parity.rs — added precisely because the Python
        # conformance harness compares one crate compiled twice rather than
        # two surfaces — could not fail a push.
        #
        # A bare `cargo test --workspace` covers lib + bins + tests/ + doctests.
        #
        # `--skip analytical_oracle_regression`: that test walks all 24,350
        # committed Horizons oracle rows through the analytical provider.
        # Its fixture IS in git, so unlike the kernel-backed tests it does not
        # skip — and in debug it had not finished after 300 s of measurement
        # (~51 s in --release). It is a release-mode test by nature and Full
        # Validation runs it there, unskipped. Nothing else is filtered.
        #
        # VEDAKSHA_REQUIRE_FIXTURES is deliberately NOT set here: the
        # SpkReader/oracle tests need the 32 MB gitignored DE440s kernel and
        # are designed to skip cleanly without it (see
        # crates/vedaksha-ephem-core/tests/common/mod.rs). Full Validation
        # sets it so a missing fixture goes red there instead of lying.
        # Nothing in this step touches the network.
        #
        # Measured cost of this change on an M4: 100.9 s -> 106.9 s
        # (workspace crates cleaned, dependency cache warm — what
        # Swatinem/rust-cache leaves behind). The vedaksha-astro lib tests
        # dominate at ~88 s; the added test targets and doctests are ~6 s.
        run: cargo test --workspace --locked -- --skip analytical_oracle_regression
      - name: Format check
        run: cargo fmt --all -- --check

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check WASM (npm binding + Python-host shim)
        run: |
          cargo check -p vedaksha-wasm --target wasm32-unknown-unknown --locked
          cargo check -p vedaksha-py-engine --target wasm32-unknown-unknown --locked

  python:
    name: Python binding (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wasm blob from engine source
        run: ./scripts/build-wasm.sh
      - name: Regenerate the parity fixture from the native engine
        run: python tests/conformance/generate_fixture.py
      - name: Install (with test + rest extras)
        run: pip install -e ".[dev,rest]" httpx
      - name: Lint
        run: ruff check src tests
      - name: Test
        # Parity vs the native engine runs here; SPK tests skip without a kernel.
        run: pytest -q

  no-std:
    name: no_std Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check vedaksha-math no_std
        run: cargo check -p vedaksha-math --no-default-features --locked
