name: CI

# Routine CI gate: fast feedback on every push and PR. Runs the whole
# workspace test surface in debug — lib, bins, tests/ and doctests.
#
# What is still NOT here, and why, lives in:
#   - .github/workflows/full-validation.yml — manual + weekly. Release-mode
#     build; downloads the 32 MB DE440s kernel so the SpkReader and oracle
#     tests actually execute instead of skipping; sets
#     VEDAKSHA_REQUIRE_FIXTURES=1 so a missing fixture is red, not green;
#     runs the #[ignore]d tiers via --include-ignored (JPL Horizons
#     live-fetch, the legacy lunar oracle, the multi-hour riseset scan
#     sweeps, the MCP 365-day transit search) plus the unskipped
#     analytical_oracle_regression; and re-fetches the IMCCE primary
#     distributions to verify the coefficient blobs have not drifted.
#     Clippy is NOT in that list any more — it runs here too, on every push,
#     because running it weekly is what let a lint break sit red for a
#     fortnight. Full Validation still runs it as a backstop.
#   - .github/workflows/release.yml         — every tag
# This workflow targets ~3 minutes total.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Unit + integration tests + doctests
        # Debug mode — one build artifact set.
        #
        # This step used to be `--lib` plus one hand-picked integration
        # target. `--lib` compiles neither `tests/` nor the bin targets, so
        # every integration test and every doctest ran ONLY in the weekly
        # Full Validation job. That is the same blind spot that let Full
        # Validation sit red for a fortnight when clippy 1.97 started firing
        # on untouched code: what runs per push was never what runs on the
        # schedule. Concretely it meant `vedaksha-wasm`'s
        # mcp_surface_parity.rs — added precisely because the Python
        # conformance harness compares one crate compiled twice rather than
        # two surfaces — could not fail a push.
        #
        # A bare `cargo test --workspace` covers lib + bins + tests/ + doctests.
        #
        # `--skip analytical_oracle_regression`: that test walks all 24,350
        # committed Horizons oracle rows through the analytical provider.
        # Its fixture IS in git, so unlike the kernel-backed tests it does not
        # skip — and in debug it had not finished after 300 s of measurement
        # (~51 s in --release). It is a release-mode test by nature and Full
        # Validation runs it there, unskipped. Nothing else is filtered.
        #
        # VEDAKSHA_REQUIRE_FIXTURES is deliberately NOT set here: the
        # SpkReader/oracle tests need the 32 MB gitignored DE440s kernel and
        # are designed to skip cleanly without it (see
        # crates/vedaksha-ephem-core/tests/common/mod.rs). Full Validation
        # sets it so a missing fixture goes red there instead of lying.
        # Nothing in this step touches the network.
        #
        # Measured cost of this change on an M4: 100.9 s -> 106.9 s
        # (workspace crates cleaned, dependency cache warm — what
        # Swatinem/rust-cache leaves behind). The vedaksha-astro lib tests
        # dominate at ~88 s; the added test targets and doctests are ~6 s.
        run: cargo test --workspace --locked -- --skip analytical_oracle_regression
      - name: Clippy
        # Clippy used to run ONLY in the weekly Full Validation job, and that is
        # the direct cause of the two-week red this branch was opened to clear:
        # the toolchain moved, a new clippy release started firing on code
        # nobody had touched, and no push could tell anyone. A lint gate that
        # runs weekly reports a fortnight late and blames the wrong commit.
        #
        # Cheap enough that there was never a cost argument for leaving it out.
        # `cargo clippy` is a check-only pass, and because it uses the same
        # `dev` profile as the step above, every dependency artifact is already
        # on disk — only the 9 workspace crates are actually clippy-driven.
        # Measured marginal cost in exactly this position (workspace crates
        # cleaned, dependency cache warm — what Swatinem/rust-cache leaves
        # behind, then the test step above, then this):
        #
        #   local, aarch64 --debug          4.0 s   (warm re-run: 0.17 s)
        #   ubuntu-latest, same command     9-11 s  (measured on the identical
        #                                            step in full-validation.yml
        #                                            across 4 green runs)
        #
        # So ~10 s on a workflow that targets ~3 minutes end to end — well
        # inside the run-to-run noise of the step above, for the gate that
        # would have caught the outage on the push that caused it.
        #
        # RUSTFLAGS is deliberately NOT set here, unlike full-validation.yml.
        # Setting it changes the fingerprint of every crate including
        # dependencies, which would invalidate the cache the step above just
        # populated and force a full rebuild. `-- -D warnings` gets the same
        # deny behaviour for the crates being linted without that cost.
        #
        # `--all-targets` since v7.2.0. Without it only the libs were linted:
        # crate-level `#![allow]` attributes never reached `tests/`, `benches/`
        # or `examples/`, so 153 warnings accumulated there unseen, and two of
        # them were real -- a `--release`-only guard that was never called, and
        # five imports orphaned by a deletion. The lint policy now lives in the
        # root `[workspace.lints]` table, which does cover every target.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Format check
        run: cargo fmt --all -- --check

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check WASM (npm binding + Python-host shim)
        run: |
          cargo check -p vedaksha-wasm --target wasm32-unknown-unknown --locked
          cargo check -p vedaksha-py-engine --target wasm32-unknown-unknown --locked

  python:
    name: Python binding (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wasm blob from engine source
        run: ./scripts/build-wasm.sh
      - name: Regenerate the parity fixture from the native engine
        run: python tests/conformance/generate_fixture.py
      - name: Install (with test + rest extras)
        run: pip install -e ".[dev,rest]" httpx
      - name: Lint
        run: ruff check src tests
      - name: Test
        # Parity vs the native engine runs here; SPK tests skip without a kernel.
        run: pytest -q

  no-std:
    name: no_std Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check vedaksha-math no_std
        # vedaksha-math is the ONLY crate in this workspace that is genuinely
        # no_std, which is why this job names it rather than the workspace.
        # Four other crates carried `#![cfg_attr(not(feature = "std"),
        # no_std)]` until v5.0.0 while failing to compile that way — nothing
        # checked them, because nothing here ever built them without default
        # features. If you make another crate no_std, add it to this line;
        # the attribute alone is not evidence.
        run: cargo check -p vedaksha-math --no-default-features --locked
      - name: Check the workspace builds without default features
        # Separate guarantee from no_std: this proves `--no-default-features`
        # resolves and compiles across every crate (with std still available).
        # It did not, before the false no_std attributes came off.
        run: cargo check --workspace --no-default-features --locked

  publish-order:
    name: Release publish order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo publish resolves each dependency against crates.io, not the path.
      # A crate published before something it depends on kills the release
      # HALFWAY -- and crates.io publishes cannot be withdrawn. v5.0.1 shipped
      # two of seven crates that way. Cheap check, expensive failure.
      - name: Check release.yml publishes in dependency order
        run: python3 scripts/check_publish_order.py
      # Each crate carries its own LICENSE, and that copy -- not the workspace
      # root -- is what cargo archives into the .crate. The 6.0.1 licence fix
      # edited the root, passed every check here, and still left eight stale
      # copies; it was caught by unpacking a built .crate. crates.io publishes
      # cannot be withdrawn, so this runs before the tag.
      - name: LICENSE copies match the workspace root
        run: python3 scripts/check_license_sync.py

      # GitHub cannot detect BUSL-1.1 -- its licence API has no entry, which is
      # why this repo, terraform and cockroach all report "Other". The SPDX tag
      # in each source header is the compensating mechanism, and it is what
      # scancode, REUSE and SBOM tooling actually read. A one-off sweep is not a
      # guarantee: the sweep that added these only touched files that already
      # had an older licence comment, so 27 were missed, the whole Python
      # package among them.
      - name: Every source file carries an SPDX identifier
        run: python3 scripts/check_spdx_headers.py

  spec-hygiene:
    name: Derivation-spec hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_spec_hygiene.py derives its patterns by reading the baseline
          # tag out of git history, so a shallow clone would leave it with zero
          # patterns. It refuses to pass vacuously in that case, but fetching
          # the history is the fix, not the failure.
          fetch-depth: 0
      # A derivation spec that restates the values it is meant to replace hands
      # the implementation agent its own target. The 2026-08-17 draft did
      # exactly that while declaring itself clean, which is why this is a
      # mechanical gate and not a review note. Patterns live in the script,
      # never in the spec -- an inline list would make the document match its
      # own check.
      #
      # migration-note.md is deliberately NOT in this list. Its whole job is to
      # state the delta against the values that were replaced, per spec section
      # 6.4, and it is written after the freeze commit so it cannot influence
      # them. The gate is a check on the spec's own hygiene, not a general leak
      # detector -- see spec.md section 11.9.
      - name: Derivation specs must not restate previously shipped constants
        run: |
          python3 scripts/check_spec_hygiene.py \
            docs/audit/2026-08-17-ayanamsha-cleanroom/spec.md \
            docs/audit/2026-08-17-ayanamsha-cleanroom/derivation-inputs.json \
            docs/audit/2026-08-17-ayanamsha-cleanroom/README.md

  msrv:
    name: MSRV (rust-version in workspace.package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned deliberately to the declared MSRV, NOT to `stable`. Every other
      # job here resolves stable and then defers to rust-toolchain.toml (1.97.1),
      # so before this job the only mechanical check that the declared MSRV
      # still held was the release Docker image building on rust:1.89-slim —
      # i.e. the claim was verified at tag time, or not at all.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: Check at the declared MSRV
        # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml, which would otherwise
        # pull 1.97.1 back in and make this job a no-op that always passed.
        env:
          RUSTUP_TOOLCHAIN: "1.89"
        run: |
          rustc --version
          cargo check --workspace --locked --all-features
