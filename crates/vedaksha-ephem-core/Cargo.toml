[package]
name = "vedaksha-ephem-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
license-file.workspace = true
rust-version.workspace = true
description = "Astronomy/ephemeris engine: JPL DE440s/DE441 SPK reader, VSOP87A, ELP/MPP02, precession, nutation"
keywords = ["ephemeris", "astronomy", "jpl", "vsop87", "orbital"]
categories = ["science", "mathematics"]

[dependencies]
libm = "0.2"
vedaksha-math = { version = "7.0.0", path = "../vedaksha-math" }
# SIMD lanes (safe wrapper over core::arch; no_std). Used to vectorize the
# ELP/MPP02 lunar-series trig evaluation.
#
# OPEN FINDING — the 0.7.33 -> 1.6.1 bump is NOT bit-identical. Recorded here so
# nobody redoes the measurement; the verdict is not mine to record.
#
# The bump was originally validated against `oracle_comparison.rs`'s digest
# (6dea5ddbd3c61b08...), which is a blind instrument for this dependency: that
# test drives a SpkReader over the DE440s kernel and never enters
# `analytical/`. The oracle that does is `analytical_oracle.rs`. Fingerprinting
# its 21,915 rows (9 bodies x 2,435; Pluto has no analytical theory) with
# `tests/analytical_bit_digest.rs` on aarch64 --release, 2026-08-16:
#
#   ee85cdf^ (wide 0.7.33, safe_arch 0.7.4)
#     all bodies e35c5e3ab95dcb35a816d77313a35fa8e773bd7637568bd450e98e3eaef7bb81
#     Moon only  0e88983d6b533ed73553613d8a75d41705139ac15bd9c4289662ce28a43c8f99
#   ee85cdf and HEAD (wide 1.6.1, safe_arch 1.2.0) — identical to each other
#     all bodies f943337e6dbfe1d7881a001749009e7aa322cbbff2c4aa4e89c4e1db4c266b80
#     Moon only  95c7ae2a8ad7396a31de9245111109d77e144b5fcb2d43b978b065554a69142b
#
# Delta: 6 of 21,915 rows (0.03%), every one of them the Moon — i.e. confined to
# ELP/MPP02, the only consumer of `wide`. All eight other bodies are byte-exact.
# Magnitude is 1 ULP of ecliptic longitude (1.11e-16 rad ~ 2.3e-5 microarcsec),
# <=4 ULP of latitude, <=28 ULP of longitude_speed (a differenced quantity, so it
# amplifies). That is ~10 orders of magnitude below ELP/MPP02's own ~0.169"
# disagreement with DE441, so no accuracy claim in the repo moves.
#
# Attribution is exact, not inferred. Exactly one commit in ee85cdf^..HEAD
# touches crates/vedaksha-ephem-core/src or crates/vedaksha-math/src — 57e74cc —
# and every changed line in it is a `//!` comment, so it cannot alter codegen
# (`git diff ee85cdf^ HEAD -- crates/vedaksha-ephem-core/src` filtered to
# non-comment lines is empty). ee85cdf's own Cargo.lock delta is wide +
# safe_arch and nothing else, and the ee85cdf digest already equals HEAD's.
#
# Independently reproduced 2026-08-16 in a second session from clean worktrees
# (`ee85cdf^` = 391367d with wide 0.7.33/safe_arch 0.7.4 vs HEAD): both
# all-bodies digests and both Moon-only digests came back byte-for-byte equal to
# the values above, over 21,915 rows each with 0 out-of-range and 0 error rows.
# The 6 differing rows are the 6 listed by `diff`; magnitudes re-derived from
# the raw bit patterns rather than carried over.
#
# Re-run: see the module comment of tests/analytical_bit_digest.rs.
wide = { version = "1.6.1", default-features = false }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Path-only dev-deps: these crates depend on ephem-core (circular), so they
# cannot exist on crates.io until ephem-core is published. Omitting the
# version field tells cargo to treat them as local-only for testing and
# not require them during `cargo publish`.
vedaksha-astro = { path = "../vedaksha-astro" }
vedaksha-vedic = { path = "../vedaksha-vedic" }
criterion = "0.5"

[features]
default = ["std"]
std = []

[[bench]]
name = "ephemeris"
harness = false
